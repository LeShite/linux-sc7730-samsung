# CD rate for the whole PipeWire graph (the hardware takes 16 bit only).
# Copied to /etc/pipewire/pipewire.conf.d/ at boot by boot-custom.sh: PipeWire is started by the
# init scripts, whose HOME is not /userdata/system, so it never read the copy placed there.
context.properties = {
    default.clock.rate = 44100
    default.clock.allowed-rates = [ 44100 ]
    # ES and the games run on an A7 at 1.3 GHz: wake PipeWire less often, with more slack
    default.clock.quantum       = 2048
    default.clock.min-quantum   = 1024
}
